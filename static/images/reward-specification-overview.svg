<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
  <title id="title">GRPO reward specification study overview</title>
  <desc id="desc">A compact diagram showing RWKU prompts, initialization, GRPO reward specifications, held-out endpoint audits, RWKU benchmark scores, and policy-support training dynamics.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#17211f" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #f8fbfa; }
      .frame { fill: #ffffff; stroke: #dbe7e2; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #dbe7e2; stroke-width: 2.4; filter: url(#shadow); }
      .soft { fill: #eef4f1; stroke: #dbe7e2; stroke-width: 2; }
      .title { fill: #17211f; font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0; }
      .subtitle { fill: #5e6f6a; font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: 0; }
      .label { fill: #17211f; font-family: Inter, Arial, sans-serif; font-size: 25px; font-weight: 800; letter-spacing: 0; }
      .smallLabel { fill: #17211f; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0; }
      .text { fill: #5e6f6a; font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: 0; }
      .tiny { fill: #5e6f6a; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 0; }
      .bottomText { fill: #5e6f6a; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 650; letter-spacing: 0; }
      .tagText { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0; }
      .arrow { stroke: #48645e; stroke-width: 4; fill: none; }
      .arrowHead { fill: #48645e; }
      .teal { fill: #0f766e; }
      .coral { fill: #c2410c; }
      .amber { fill: #b7791f; }
      .violet { fill: #6d5bd0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="700"/>
  <rect class="frame" x="36" y="34" width="968" height="632" rx="18"/>

  <text class="title" x="74" y="90">Reward and support shape the endpoint</text>
  <text class="subtitle" x="76" y="123">RWKU scores, held-out behavior, and dynamics are separate evidence.</text>
  <text class="subtitle" x="76" y="150">SFT warm-up enables learning; the reward still decides what is reinforced.</text>

  <rect class="card" x="74" y="184" width="250" height="112" rx="10"/>
  <text class="label" x="108" y="230">RWKU</text>
  <text class="text" x="108" y="262">forget prompts</text>

  <path class="arrow" d="M332 240 H382"/>
  <path class="arrowHead" d="M382 233 L394 240 L382 247 Z"/>

  <rect class="card" x="406" y="184" width="260" height="112" rx="10"/>
  <text class="label" x="438" y="225">Initialization</text>
  <rect class="soft" x="438" y="242" width="76" height="34" rx="17"/>
  <text class="tiny" x="454" y="265">cold</text>
  <rect class="soft" x="530" y="242" width="76" height="34" rx="17"/>
  <text class="tiny" x="546" y="265">warm</text>
  <text class="tiny" x="438" y="292">policy support</text>

  <path class="arrow" d="M674 240 H712"/>
  <path class="arrowHead" d="M712 233 L724 240 L712 247 Z"/>

  <rect class="card" x="736" y="184" width="230" height="112" rx="10"/>
  <text class="label" x="784" y="230">GRPO</text>
  <text class="text" x="784" y="262">LoRA update</text>

  <path class="arrow" d="M851 302 V330"/>
  <path class="arrowHead" d="M844 330 L851 342 L858 330 Z"/>

  <rect class="card" x="170" y="352" width="700" height="118" rx="10"/>
  <text class="label" x="212" y="394">Reward specification</text>
  <rect class="amber" x="214" y="416" width="74" height="38" rx="19"/>
  <text class="tagText" x="238" y="441">R0</text>
  <rect class="teal" x="312" y="416" width="74" height="38" rx="19"/>
  <text class="tagText" x="336" y="441">R1</text>
  <rect class="violet" x="410" y="416" width="74" height="38" rx="19"/>
  <text class="tagText" x="434" y="441">R2</text>
  <rect class="coral" x="508" y="416" width="74" height="38" rx="19"/>
  <text class="tagText" x="532" y="441">R4</text>
  <text class="text" x="628" y="440">selects the endpoint</text>

  <text class="tiny" x="90" y="518">Evaluation lenses</text>

  <rect class="card" x="74" y="536" width="280" height="96" rx="10"/>
  <text class="smallLabel" x="96" y="574">Held-out endpoints</text>
  <text class="bottomText" x="96" y="604">broad helpfulness</text>
  <text class="bottomText" x="96" y="626">leakage / avoidance</text>

  <rect class="card" x="380" y="536" width="280" height="96" rx="10"/>
  <text class="smallLabel" x="402" y="574">RWKU benchmark</text>
  <text class="bottomText" x="402" y="604">forget deltas</text>
  <text class="bottomText" x="402" y="626">utility trade-offs</text>

  <rect class="card" x="686" y="536" width="280" height="96" rx="10"/>
  <text class="smallLabel" x="708" y="574">Training dynamics</text>
  <text class="bottomText" x="708" y="604">active groups</text>
  <text class="bottomText" x="708" y="626">reward / KL</text>
</svg>
